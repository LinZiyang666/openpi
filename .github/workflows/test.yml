name: Test
on:
  pull_request:
    branches:
      - "*"

jobs:
  run_tests:
    name: Run Tests
    runs-on: openpi-verylarge
    env:
      GIT_LFS_SKIP_SMUDGE: true
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        # --run-manual disables the root-conftest default-skip so env_dependent
        # tests still run on this provisioned runner; -m "not manual" keeps the
        # GPU/external `manual` set excluded. Net coverage is unchanged from
        # before the default-skip was introduced.
        run: uv run pytest --strict-markers --run-manual -m "not manual"
