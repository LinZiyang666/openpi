# OpenPI Cache Configuration
# Cache subsystem config file. Specify via CLI:
#   uv run scripts/serve_policy.py --cache_config cache.yaml
#   uv run scripts/serve_policy.py --cache_config configs/experiment_rrf.yaml
# Server/policy/debug/collect parameters are still passed via tyro CLI.

enabled: true

timer:
  enabled: true
  buffer_size: 10000
  output_csv_dir: null    # null = terminal only, no CSV

# Query vector field config.
# enabled: whether the field participates in cache key building and search.
# weight: fusion weight for SearchStrategy (higher = more important in RRF fusion).
# Dimensions are raw flattened: vision = 256 tokens * emb_dim, prompt = max_lang_tokens * emb_dim.
# Actual values depend on dataset (set by qdrant_ingest_openpi.py at collection creation).
# task_key filtering: not yet implemented, requires task normalization pipeline.
keys:
  vision_0:    { enabled: true,  weight: 1.0 }   # base_0_rgb, [256, emb_dim] flattened
  vision_1:    { enabled: true,  weight: 1.0 }   # left_wrist_0_rgb, [256, emb_dim] flattened
  vision_2:    { enabled: true,  weight: 1.0 }   # right_wrist_0_rgb, [256, emb_dim] flattened
  prompt_emb:  { enabled: true,  weight: 1.0 }   # language tokens, [max_lang_tokens, emb_dim] padded+flattened
  robot_state: { enabled: true,  weight: 1.0 }   # raw state vector [action_dim]

key_builder:
  type: full_original       # "full_original" = raw flatten, matches collect hook output
                            # "placeholder" = robot_state only (for testing)

# Per-checkpoint config: CP1 and CP3 can be configured independently.
checkpoints:
  _defaults: &cp_defaults
    gate:
      type: always_search
    search_strategy:
      type: simple_knn
      top_k: 1
      step_filter: all    # "all" | "exact" | "window"
      step_window: 5      # only effective when step_filter=window
      rrf_k: 60           # Qdrant RRF fusion param (in_memory backend ignores)
      candidate_multiplier: 5  # Qdrant prefetch = top_k * multiplier (in_memory ignores)

  cp1:
    <<: *cp_defaults
    enabled: true           # set false to disable CP1 cache check entirely
    judge:
      type: threshold
      threshold: 0.98     # WARNING: placeholder, needs calibration with real data
      # Multi-field RRF fusion: score is a small positive number, NOT cosine [-1,1].
      # Recalibrate with real data.

  cp3:
    <<: *cp_defaults
    enabled: true           # set false to disable CP3 cache check entirely
    judge:
      type: threshold
      threshold: 0.95     # WARNING: placeholder, needs calibration with real data

backend:
  type: qdrant            # "in_memory" | "qdrant"
  # vector_dims must match the Qdrant collection schema created by qdrant_ingest_openpi.py.
  # These are full flattened dims; the backend handles Qdrant's 65535-dim chunk limit internally.
  # To get actual values, run: python exp/qdrant_ingest_openpi.py --dry-run --data-dir <path>
  # and read the dataset summary output.
  vector_dims:
    vision_0: 524288      # 256 * 2048 (SigLIP patch_size=14, 224/14=16, 16^2=256 tokens)
    vision_1: 524288
    vision_2: 524288
    prompt_emb: 409600    # 200 (max_lang_tokens) * 2048 — must match Qdrant collection schema
    robot_state: 32       # action_dim
  qdrant:
    url: ${QDRANT_URL:-http://155.98.36.13:6333}
    collection_name: openpi_steps_named   # must match qdrant_ingest_openpi.py --named-collection
    prefer_grpc: false
    grpc_port: 6334
    request_timeout: 30
