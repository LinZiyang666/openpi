# OpenPI Cache Configuration
# Cache subsystem config file. Specify via CLI:
#   uv run scripts/serve_policy.py --cache_config cache.yaml
#   uv run scripts/serve_policy.py --cache_config configs/experiment_rrf.yaml
# Server/policy/debug/collect parameters are still passed via tyro CLI.

enabled: true

timer:
  enabled: true
  buffer_size: 10000
  output_csv_dir: null    # null = terminal only, no CSV

# Query vector field config.
# enabled: whether the field participates in cache key building and search.
# weight: fusion weight for SearchStrategy (higher = more important in RRF fusion).
keys:
  vision_0:    { enabled: true,  weight: 1.0 }
  vision_1:    { enabled: false, weight: 1.0 }
  vision_2:    { enabled: false, weight: 1.0 }
  prompt_emb:  { enabled: false, weight: 1.0 }
  robot_state: { enabled: true,  weight: 1.0 }

key_builder:
  type: cp1_mean_pool     # "cp1_mean_pool" | "cp1_spatial_pool_16" | "cp1_spatial_pool_64" | "cp1_max_pool" | "placeholder"

# Per-checkpoint config: CP1 and CP3 can be configured independently.
checkpoints:
  _defaults: &cp_defaults
    gate:
      type: always_search
    search_strategy:
      type: weighted_rrf_knn   # "weighted_rrf_knn" | "weighted_score_sum_knn" (in_memory only)
      top_k: 1
      step_filter: all         # "all" | "exact" | "window"
      step_window: 5           # only used when step_filter=window
      rrf_k: 60                # only used by weighted_rrf_knn
      trajectory_depth: 3      # 1 = single-step; >1 enables trajectory search (in_memory only)
      trajectory_weights: [0.6, 0.3, 0.1]  # newest-first, length must == trajectory_depth

  cp1:
    <<: *cp_defaults
    enabled: true
    judge:
      type: always_hit

  cp3:
    <<: *cp_defaults
    enabled: true
    judge:
      type: always_hit

backend:
  type: in_memory
  vector_dims:
    vision_0: 2048        # cp1_mean_pool output dim
    vision_1: 2048
    vision_2: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: data/cache_artifacts/libero_spatial/cp1_mean_pool.pkl    # set to artifact .pkl path, e.g. data/cache_artifacts/libero_spatial/cp1_mean_pool.pkl

# Write policy: controls whether trajectory data is written to cache at episode end.
# "on_any_miss" = write if episode had any CP1 miss (default)
# "always" = always write
# "never" = read-only mode
write_policy:
  type: never
