enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.5
  vision_1:
    enabled: true
    weight: 0.25
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.25
key_builder:
  type: cp1_spatial_pool_16
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: composite
      normalization:
        type: zscore
        params: {}
        stats_source:
          type: offline
      factors:
      - type: jerk_offline_state
        params:
          windows:
          - past: 5
            future: 5
          - past: 7
            future: 7
      calibration:
        type: percentile_rolling
        params:
          window_size: 50
        samples_source:
          type: warmup
      composer:
        type: weighted_sum_zero_nan
        weights:
          jerk_offline_state__p5_f5: 1.0
          jerk_offline_state__p7_f7: 1.0
        tier_thresholds:
          full_hit: 0.17000000000000004
          warm_start: 0.0
        warm_start_t: 0.5
      export_factor_outputs: true
    search_strategy:
      type: weighted_rrf_knn
      rrf_k: 60
      top_k: 1
      trajectory_depth: 4
      trajectory_weights:
      - 1.0
      - 0.7
      - 0.48999999999999994
      - 0.3429999999999999
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
backend:
  type: in_memory
  vector_dims:
    vision_0: 32768
    vision_1: 32768
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_spatial_pool_16.pkl
    index_type: brute_force
write_policy:
  type: never
