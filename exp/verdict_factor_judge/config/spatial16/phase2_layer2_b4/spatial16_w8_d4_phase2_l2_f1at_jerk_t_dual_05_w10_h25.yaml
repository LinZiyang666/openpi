enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.5
  vision_1:
    enabled: true
    weight: 0.25
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.25
key_builder:
  type: cp1_spatial_pool_16
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: composite
      factors:
      - type: f1a_t
        params:
          window_k: 3
          descriptors:
          - jerk
      composer:
        type: weighted_sum
        weights:
          f1a_t_jerk: 1.0
        tier_thresholds:
          full_hit: 0.25
          warm_start: 0.1
        warm_start_t: 0.5
      normalizer:
        type: percentile_rolling
        window_size: 50
        cold_start_strategy: force_miss
      all_nan_fallback:
        type: warm_start
        start_t: 0.7
      export_factor_outputs: true
    search_strategy:
      type: weighted_rrf_knn
      top_k: 1
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
      rrf_k: 60
      trajectory_depth: 4
      trajectory_weights:
      - 0.4
      - 0.3
      - 0.2
      - 0.1
backend:
  type: in_memory
  vector_dims:
    vision_0: 32768
    vision_1: 32768
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_spatial_pool_16.pkl
    index_type: brute_force
write_policy:
  type: never
