enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.1
  vision_1:
    enabled: true
    weight: 0.1
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.8
key_builder:
  type: clip
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: always_warm_start
      start_t: 0.7
      dump:
        deferred: true
        config_id: clip_w7_d4_phase2_f1b_a_w_short_d_curv_t_full__warmup
        factors:
        - type: f1a_a
          params:
            window_k: 3
            descriptors: &id001
            - jerk
            - dir
            - curv_radius
            - cum_disp
        - type: f1a_t
          params:
            window_k: 3
            descriptors: *id001
        - type: f1b_a
          params:
            windows: &id002
            - past: 0
              future: 3
            - past: 1
              future: 1
            - past: 3
              future: 0
            - past: 0
              future: 5
            - past: 5
              future: 0
            - past: 2
              future: 2
            - past: 3
              future: 3
            - past: 5
              future: 5
            - past: 7
              future: 7
            descriptors: *id001
            active_eps: 0.01
        - type: f1b_t
          params:
            windows: *id002
            descriptors: *id001
            active_eps: 0.01
        - type: f2
          params:
            K: 5
    search_strategy:
      type: weighted_rrf_knn
      top_k: 5
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
      rrf_k: 60
      trajectory_depth: 4
      trajectory_weights:
      - 0.4
      - 0.3
      - 0.2
      - 0.1
backend:
  type: in_memory
  vector_dims:
    vision_0: 512
    vision_1: 512
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/clip_vit_b_32.pkl
    index_type: brute_force
write_policy:
  type: never
