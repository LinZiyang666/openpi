enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.5
  vision_1:
    enabled: true
    weight: 0.0
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.5
key_builder:
  type: cp1_max_pool
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: always_hit
      dump:
        path: exp/verdict_factor_judge/data/calibration/max_pool_w3_d5_phase0_always_hit_dump.jsonl
        config_id: max_pool_w3_d5_phase0_always_hit_dump
        factors:
          - type: f1a_a
            params:
              window_k: 3
              descriptors: [jerk, dir, curv_radius, cum_disp]
          - type: f1a_t
            params:
              window_k: 3
              descriptors: [jerk, dir, curv_radius, cum_disp]
          - type: f1b_a
            params:
              windows:
                - {past: 0, future: 3}
                - {past: 1, future: 1}
                - {past: 3, future: 0}
                - {past: 0, future: 5}
                - {past: 5, future: 0}
              descriptors: [jerk, dir, curv_radius, cum_disp]
              active_eps: 0.01
          - type: f1b_t
            params:
              windows:
                - {past: 0, future: 3}
                - {past: 1, future: 1}
                - {past: 3, future: 0}
                - {past: 0, future: 5}
                - {past: 5, future: 0}
              descriptors: [jerk, dir, curv_radius, cum_disp]
              active_eps: 0.01
          - type: f2
            params:
              K: 5
    search_strategy:
      type: weighted_rrf_knn
      top_k: 5
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
      rrf_k: 60
      trajectory_depth: 5
      trajectory_weights:
      - 0.35
      - 0.25
      - 0.2
      - 0.12
      - 0.08
backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_max_pool.pkl
    index_type: brute_force
write_policy:
  type: never
