enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.5
  vision_1:
    enabled: true
    weight: 0.0
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.5
key_builder:
  type: cp1_max_pool
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: composite
      factors:
      - type: f1a_a
        params:
          window_k: 3
          descriptors: &id001
          - jerk
          - dir
          - curv_radius
          - cum_disp
      - type: f1a_t
        params:
          window_k: 3
          descriptors: *id001
      - type: f1b_a
        params:
          windows: &id002
          - past: 0
            future: 3
          - past: 1
            future: 1
          - past: 3
            future: 0
          - past: 0
            future: 5
          - past: 5
            future: 0
          descriptors: *id001
          active_eps: 0.01
      - type: f1b_t
        params:
          windows: *id002
          descriptors: *id001
          active_eps: 0.01
      - type: f2
        params:
          K: 5
      composer:
        type: weighted_sum
        weights:
          f1a_a_jerk: 1.0
          f1a_a_dir: 1.0
          f1a_a_curv_radius: 1.0
          f1a_a_cum_disp: 1.0
          f1a_t_jerk: 1.0
          f1a_t_dir: 1.0
          f1a_t_curv_radius: 1.0
          f1a_t_cum_disp: 1.0
          f1b_a_jerk__p0_f3: 1.0
          f1b_a_jerk__p1_f1: 1.0
          f1b_a_jerk__p3_f0: 1.0
          f1b_a_jerk__p0_f5: 1.0
          f1b_a_jerk__p5_f0: 1.0
          f1b_a_dir__p0_f3: 1.0
          f1b_a_dir__p1_f1: 1.0
          f1b_a_dir__p3_f0: 1.0
          f1b_a_dir__p0_f5: 1.0
          f1b_a_dir__p5_f0: 1.0
          f1b_a_curv_radius__p0_f3: 1.0
          f1b_a_curv_radius__p1_f1: 1.0
          f1b_a_curv_radius__p3_f0: 1.0
          f1b_a_curv_radius__p0_f5: 1.0
          f1b_a_curv_radius__p5_f0: 1.0
          f1b_a_cum_disp__p0_f3: 1.0
          f1b_a_cum_disp__p1_f1: 1.0
          f1b_a_cum_disp__p3_f0: 1.0
          f1b_a_cum_disp__p0_f5: 1.0
          f1b_a_cum_disp__p5_f0: 1.0
          f1b_t_jerk__p0_f3: 1.0
          f1b_t_jerk__p1_f1: 1.0
          f1b_t_jerk__p3_f0: 1.0
          f1b_t_jerk__p0_f5: 1.0
          f1b_t_jerk__p5_f0: 1.0
          f1b_t_dir__p0_f3: 1.0
          f1b_t_dir__p1_f1: 1.0
          f1b_t_dir__p3_f0: 1.0
          f1b_t_dir__p0_f5: 1.0
          f1b_t_dir__p5_f0: 1.0
          f1b_t_curv_radius__p0_f3: 1.0
          f1b_t_curv_radius__p1_f1: 1.0
          f1b_t_curv_radius__p3_f0: 1.0
          f1b_t_curv_radius__p0_f5: 1.0
          f1b_t_curv_radius__p5_f0: 1.0
          f1b_t_cum_disp__p0_f3: 1.0
          f1b_t_cum_disp__p1_f1: 1.0
          f1b_t_cum_disp__p3_f0: 1.0
          f1b_t_cum_disp__p0_f5: 1.0
          f1b_t_cum_disp__p5_f0: 1.0
          f2_var: 1.0
        tier_thresholds:
          full_hit: 0.5
          warm_start: 0.3
        directions:
          f1a_a_curv_radius: range:[0.3, 0.7]
          f1a_a_cum_disp: high
          f1a_t_curv_radius: range:[0.3, 0.7]
          f1a_t_cum_disp: high
          f1b_a_curv_radius__p0_f3: range:[0.3, 0.7]
          f1b_a_curv_radius__p1_f1: range:[0.3, 0.7]
          f1b_a_curv_radius__p3_f0: range:[0.3, 0.7]
          f1b_a_curv_radius__p0_f5: range:[0.3, 0.7]
          f1b_a_curv_radius__p5_f0: range:[0.3, 0.7]
          f1b_a_cum_disp__p0_f3: high
          f1b_a_cum_disp__p1_f1: high
          f1b_a_cum_disp__p3_f0: high
          f1b_a_cum_disp__p0_f5: high
          f1b_a_cum_disp__p5_f0: high
          f1b_t_curv_radius__p0_f3: range:[0.3, 0.7]
          f1b_t_curv_radius__p1_f1: range:[0.3, 0.7]
          f1b_t_curv_radius__p3_f0: range:[0.3, 0.7]
          f1b_t_curv_radius__p0_f5: range:[0.3, 0.7]
          f1b_t_curv_radius__p5_f0: range:[0.3, 0.7]
          f1b_t_cum_disp__p0_f3: high
          f1b_t_cum_disp__p1_f1: high
          f1b_t_cum_disp__p3_f0: high
          f1b_t_cum_disp__p0_f5: high
          f1b_t_cum_disp__p5_f0: high
        warm_start_t: 0.7
      normalizer:
        type: percentile_rolling
        window_size: 50
        cold_start_strategy: force_miss
      all_nan_fallback:
        type: warm_start
        start_t: 0.7
    search_strategy:
      type: weighted_rrf_knn
      top_k: 1
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
      rrf_k: 60
      trajectory_depth: 5
      trajectory_weights:
      - 0.35
      - 0.25
      - 0.2
      - 0.12
      - 0.08
backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_max_pool.pkl
    index_type: brute_force
write_policy:
  type: never
