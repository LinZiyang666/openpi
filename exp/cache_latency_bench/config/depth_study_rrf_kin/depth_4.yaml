enabled: true
timer:
  enabled: false
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.0625
  vision_1:
    enabled: true
    weight: 0.5
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: false
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.4375
key_builder:
  type: cp1_spatial_pool_16
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: composite
      normalization:
        type: zscore
        params: {}
        stats_source:
          type: offline
      factors:
      - type: jerk_online_action
        params:
          windows:
          - &id001
            past: 3
            future: 3
      - type: dispersion_online_action
        params:
          windows:
          - *id001
      calibration:
        type: percentile_rolling
        params:
          window_size: 50
        samples_source:
          type: offline
          offline:
            path: exp/weighted_sum/data/kinematic_phase5/super_warmup_raw.jsonl
            format: jsonl
      composer:
        type: weighted_sum_zero_nan
        weights:
          jerk_online_action__p3_f3: 1.0
          dispersion_online_action__p3_f3: 1.0
        tier_thresholds:
          full_hit: 0.49
          warm_start: 0.10999999999999999
        warm_start_t: 0.5
        directions:
          dispersion_online_action__p3_f3: range:[0.3, 0.7]
      export_factor_outputs: true
    search_strategy:
      type: weighted_rrf_knn
      top_k: 1
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 1.0
      rrf_k: 60
      trajectory_depth: 4
      trajectory_weights:
      - 0.4
      - 0.3
      - 0.2
      - 0.1
backend:
  type: in_memory
  vector_dims:
    vision_0: 32768
    vision_1: 32768
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_spatial_pool_16.pkl
    index_type: brute_force
write_policy:
  type: never
