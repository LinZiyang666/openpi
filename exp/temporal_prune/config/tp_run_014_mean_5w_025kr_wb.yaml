enabled: true
timer:
  enabled: true
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.5
  vision_1:
    enabled: true
    weight: 0.25
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 0.25
key_builder:
  type: cp1_temporal_prune
  prune_window_size: 5
  temporal_keep_ratio: 0.25
  reducer:
    type: mean_pool
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: always_hit
    search_strategy:
      type: weighted_rrf_knn
      top_k: 1
      step_filter: all
      rrf_k: 60
      trajectory_depth: 1
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: data/cache_artifacts/libero_spatial/temporal_prune/cp1_tp_mean_5w_025kr.pkl
    index_type: brute_force
