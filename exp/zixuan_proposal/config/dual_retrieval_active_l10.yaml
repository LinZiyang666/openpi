# TRACER Phase 4 / M2 — dual_retrieval_knn ACTIVE (non-degenerate D-), libero_10.
#
# libero_10 counterpart of dual_retrieval_active.yaml. Same fusion / gate / betas;
# only the preload artifact differs (the libero_10 merged D+/D- pool). libero_10
# is the STRONGER failure source (deployed pi05 fails more on the long-horizon
# libero_10 tasks than on libero_spatial), so its D- is larger and more diverse.
#
# Build the merged artifact first:
#   PYTHONPATH=. uv run python exp/zixuan_proposal/build_dual_artifact.py \
#     --pos-artifact exp/common/data/cache_artifacts/libero_10/cp1_mean_pool.pkl \
#     --neg-h5-dir   exp/common/data/db/failure_only/libero_10 \
#     --builder-type cp1_mean_pool \
#     --output       exp/common/data/cache_artifacts/libero_10/cp1_mean_pool_dual.pkl
#
# Betas ILLUSTRATIVE (uncalibrated); calibration is Phase 5. b2 (u_t) deferred.
enabled: true

keys:
  vision_0:    { enabled: true,  weight: 1.0 }
  vision_1:    { enabled: false, weight: 0.0 }
  vision_2:    { enabled: false, weight: 0.0 }
  prompt_emb:  { enabled: false, weight: 0.0 }
  robot_state: { enabled: true,  weight: 1.0 }

key_builder:
  type: cp1_mean_pool

checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: failure_aware_gate
      threshold: 0.5
      gate_betas: { b0: -0.9, b1: 1.0, b3: 0.0 }
    search_strategy:
      type: dual_retrieval_knn
      base_fusion: weighted_rrf
      top_k: 1
      rrf_k: 60
      trajectory_depth: 5
      trajectory_weights: [0.4, 0.3, 0.15, 0.1, 0.05]
      allowed_depths: [5]
      depth_policy:
        type: constant
        depth: 5
      margin_lambda: 0.5
      enable_dual: true
      field_similarity:
        vision_0:    { type: cosine }
        robot_state: { type: l2, to_similarity: { type: exp, tau: 1.0 } }

backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_10/cp1_mean_pool_dual.pkl
    index_type: brute_force

write_policy:
  type: never
