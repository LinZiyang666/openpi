# TRACER Phase 1 / M3 — dynamic_depth_knn CONSTANT baseline.
#
# depth_policy: constant @ trajectory_depth. This is the non-regression
# reference: a constant policy at the full max depth reproduces the fixed-depth
# weighted_rrf_knn strategy value-for-value at every history length.
enabled: true

keys:
  vision_0:    { enabled: true, weight: 1.0 }
  robot_state: { enabled: true, weight: 1.0 }

key_builder:
  type: cp1_mean_pool

checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: always_hit
    search_strategy:
      type: dynamic_depth_knn
      base_fusion: weighted_rrf          # underlying fusion (rrf | score_sum)
      top_k: 1
      rrf_k: 60
      trajectory_depth: 5                # max depth
      trajectory_weights: [0.4, 0.3, 0.15, 0.1, 0.05]   # newest-first, length == trajectory_depth
      allowed_depths: [5]                # constant depth 5 -> fixed-depth baseline
      depth_policy:
        type: constant
        depth: 5
      field_similarity:
        vision_0:    { type: cosine }
        robot_state: { type: l2, to_similarity: { type: exp, tau: 0.33 } }

backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_spatial/cp1_mean_pool.pkl

write_policy:
  type: never
