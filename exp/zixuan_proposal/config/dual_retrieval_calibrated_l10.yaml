enabled: true
keys:
  vision_0:
    enabled: true
    weight: 1.0
  vision_1:
    enabled: false
    weight: 0.0
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: false
    weight: 0.0
  robot_state:
    enabled: true
    weight: 1.0
key_builder:
  type: cp1_mean_pool
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: failure_aware_gate
      threshold: 0.5
      gate_betas:
        b0: -0.05327017977833748
        b1: 1.0
        b2: 0.0
        b3: 1.0
      warm_tiers:
      - threshold: 0.2
        start_t: 0.5
    search_strategy:
      type: dual_retrieval_knn
      base_fusion: weighted_rrf
      top_k: 1
      rrf_k: 60
      trajectory_depth: 5
      trajectory_weights:
      - 0.4
      - 0.3
      - 0.15
      - 0.1
      - 0.05
      allowed_depths:
      - 5
      depth_policy:
        type: constant
        depth: 5
      margin_lambda: 0.0
      enable_dual: true
      field_similarity:
        vision_0:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 1.0
backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: exp/common/data/cache_artifacts/libero_10/cp1_mean_pool_dual.pkl
    index_type: brute_force
write_policy:
  type: never
