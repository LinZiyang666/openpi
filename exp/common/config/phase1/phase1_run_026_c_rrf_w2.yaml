enabled: true
timer:
  enabled: true
  buffer_size: 10000
  output_csv_dir: null
keys:
  vision_0:
    enabled: true
    weight: 0.0
  vision_1:
    enabled: true
    weight: 0.0
  vision_2:
    enabled: false
    weight: 0.0
  prompt_emb:
    enabled: true
    weight: 0.0
  robot_state:
    enabled: true
    weight: 1.0
key_builder:
  type: cp1_max_pool
checkpoints:
  cp1:
    enabled: true
    gate:
      type: always_search
    judge:
      type: always_hit
    search_strategy:
      type: weighted_rrf_knn
      top_k: 1
      step_filter: all
      field_similarity:
        vision_0:
          type: cosine
        vision_1:
          type: cosine
        prompt_emb:
          type: cosine
        robot_state:
          type: l2
          to_similarity:
            type: exp
            tau: 0.334717
      rrf_k: 60
backend:
  type: in_memory
  vector_dims:
    vision_0: 2048
    vision_1: 2048
    prompt_emb: 2048
    robot_state: 32
  in_memory:
    preload_path: data/cache_artifacts/libero_spatial/cp1_max_pool.pkl
    index_type: brute_force
